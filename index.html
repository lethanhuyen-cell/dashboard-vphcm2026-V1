<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Đã Đóng</title>
  <style>
    body {
      background-color: #070D1E;
      color: #94A3B8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 32px;
      border-radius: 16px;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2 {
      color: #F8FAFC;
      font-size: 20px;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      font-size: 12px;
      font-weight: 700;
      border-radius: 999px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🔒 Hệ Thống Tạm Đóng</div>
    <h2>TRUY CẬP ĐÃ BỊ KHÓA</h2>
    <p>Hệ thống báo cáo điều hành số liệu nội bộ đã được đóng lại theo yêu cầu quản trị.</p>
  </div>
</body>
</html>
